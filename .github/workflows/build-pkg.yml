# WinePS4 Enhanced: builds WinePS4's PKG from public sources only (tools/ci-build.sh, docs/BUILD_FROM_SOURCE.md),
# checks it (tools/verify-pkg.sh), compares it with the official package (tools/compare-pkg.sh), writes its manifest
# (tools/build-manifest.sh) and, only when all of that passed, publishes it as an UNTESTED DEVICE BUILD pre-release.
# Run it from the Actions tab ("Run workflow").
name: Build PKG

on:
  workflow_dispatch:
    inputs:
      version:
        description: "WINEPS4_VERSION shown in the app (e.g. 00.71)"
        default: "00.71"
        required: true
      mingw_threads:
        description: "mingw-w64 variant for Wine's PE side (posix = as the official v00.71 package)"
        default: "posix"
        type: choice
        options: [posix, win32]
      build_os:
        description: "Ubuntu release to build on: 24.04 (this machine) or 26.04 (a container: the official v00.71's clang-21 and mingw binutils)"
        default: "24.04"
        type: choice
        options: ["24.04", "26.04"]
      publish:
        description: "Publish the PKG as an UNTESTED DEVICE BUILD pre-release (only if every check passed)"
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      WINEPS4_VERSION: ${{ inputs.version }}
      BUILD_OS: ${{ inputs.build_os }}
      MINGW_THREADS: ${{ inputs.mingw_threads }}
      WINE_CONFIGURE_EXTRA: --disable-tests
      # The Windows side as the official v00.71 was built (tools/build-wineps4.sh): i386 with clang, no translations
      WINE_I386_CC: clang-21
      WINE_GETTEXT: "no"
      # Reproduction settings for the comparison with the official package, read from it: its DWARF records the build
      # in /home/shiro/wine-ps4-build/build/wine-wow64, its user.reg the prefix user "shiro". Building in the same
      # places keeps paths and user names from hiding real differences. They change nothing on the console.
      HOME: /home/shiro
      WINE_PREFIX_USER: shiro
    steps:
      - name: Reference build home
        run: sudo mkdir -p /home/shiro && sudo chown "$(id -u):$(id -g)" /home/shiro

      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/share/dotnet /usr/local/share/chromium
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - name: Host packages
        # 469 MB of apt packages: 1-2 min on a fast mirror, 11 min in run #7, over 20 min in run #8 (a slow
        # us-east-2.ec2.archive.ubuntu.com, ~50 KB/s at times). Still bounded, so a stuck mirror stops the run.
        timeout-minutes: 45
        run: |
          mkdir -p out
          set -o pipefail
          tools/ci-run.sh deps 2>&1 | tee out/ci-build.log

      - name: Build
        timeout-minutes: 300
        run: |
          set -o pipefail
          tools/ci-run.sh all 2>&1 | tee -a out/ci-build.log

      - name: Verify the package
        timeout-minutes: 30
        run: |
          set -o pipefail
          tools/ci-run.sh verify 2>&1 | tee -a out/ci-build.log

      - name: Compare with the official package
        id: compare
        timeout-minutes: 40
        run: |
          set -o pipefail
          tools/ci-run.sh compare 2>&1 | tee -a out/ci-build.log

      - name: Manifest and logs
        if: always()
        run: |
          tools/ci-run.sh manifest 2>&1 | tee -a out/ci-build.log || true
          tools/ci-run.sh chown || true
          df -h / | tee -a out/ci-build.log
          mkdir -p logs-out
          cp out/*.md out/*.tsv out/SHA256SUMS out/FILES.sha256 out/validate.txt out/ci-build.log logs-out/ 2>/dev/null || true
          cp -r ~/ps4kit-build/logs logs-out/ps4kit 2>/dev/null || true
          cp ~/wine-ps4-build/build/wine-wow64/*.log logs-out/ 2>/dev/null || true
          cp ~/wine-ps4-build/prefix.log logs-out/ 2>/dev/null || true
          cp ~/oo-src/*.log logs-out/ 2>/dev/null || true
          tar -czf build-logs.tar.gz -C logs-out .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-${{ github.run_number }}
          path: logs-out
          retention-days: 90

      # A package whose comparison failed is NOT ACCEPTED and is never published; it is kept as an artifact, under that
      # name, so that a specific build (its sha256 in SHA256SUMS) can be reviewed and, on a separate decision, tested.
      # Only when the build and its verification passed and the comparison is what failed.
      - name: Keep the NOT ACCEPTED package (comparison failed)
        if: ${{ always() && steps.compare.outcome == 'failure' && hashFiles('out/*.pkg') != '' }}
        run: |
          mkdir -p not-accepted
          {
            echo "NOT ACCEPTED - comparison failed"
            echo
            echo "This package did not pass the comparison with the official WinePS4 v${WINEPS4_VERSION} package"
            echo "(COMPARISON.md lists every unexplained difference). It is not a release, it is not accepted, and it"
            echo "has not been run on a console. Keep the official package to go back to."
            echo
            echo "repository: ${GITHUB_REPOSITORY}"
            echo "commit: ${GITHUB_SHA}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (#${GITHUB_RUN_NUMBER})"
            echo "inputs: version=${{ inputs.version }} mingw_threads=${{ inputs.mingw_threads }} build_os=${{ inputs.build_os }} publish=${{ inputs.publish }}"
            echo "build configuration: WINE_I386_CC=${WINE_I386_CC} WINE_GETTEXT=${WINE_GETTEXT} MINGW_THREADS=${MINGW_THREADS} WINE_CONFIGURE_EXTRA=${WINE_CONFIGURE_EXTRA} HOME=${HOME} WINE_PREFIX_USER=${WINE_PREFIX_USER}"
            echo
            echo "sha256:"
            cat out/SHA256SUMS
          } > not-accepted/STATUS-NOT-ACCEPTED.txt
          cp out/WinePS4-v*.pkg out/SHA256SUMS out/FILES.sha256 out/validate.txt out/VERIFY.md out/COMPARISON.md \
             out/BUILD_MANIFEST.md out/stages.tsv not-accepted/
          ( cd not-accepted && sha256sum -c --ignore-missing SHA256SUMS )
          ls -la not-accepted
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.compare.outcome == 'failure' && hashFiles('out/*.pkg') != '' }}
        with:
          name: NOT-ACCEPTED_comparison-failed_WinePS4-v${{ inputs.version }}_run${{ github.run_number }}
          path: not-accepted
          compression-level: 0
          retention-days: 30

      - name: Publish the UNTESTED DEVICE BUILD pre-release
        if: ${{ success() && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG="out/WinePS4-v${WINEPS4_VERSION}.pkg"
          SHA=$(sha256sum "$PKG" | cut -d' ' -f1)
          TAG="untested-build-v${WINEPS4_VERSION}-${GITHUB_RUN_NUMBER}"
          gzip -c out/ci-build.log > ci-build.log.gz
          {
            echo "## ⚠️ UNTESTED DEVICE BUILD"
            echo
            echo "**Built from public sources. Not installed or run on a console by anyone yet.** Evidence level:"
            echo "BUILD-VERIFIED (VERIFY.md) and compared with the official v${WINEPS4_VERSION} package (COMPARISON.md)."
            echo "Keep the official package at hand to go back to."
            echo
            echo "- Upstream: iHaiDeeZ/WinePS4 v${WINEPS4_VERSION}, built from this repository at ${GITHUB_SHA}"
            echo "- mingw-w64 variant: ${MINGW_THREADS}; built on Ubuntu ${BUILD_OS}"
            echo "- PKG sha256: \`${SHA}\`"
            echo "- Every source commit, archive checksum, download retry and build stage: BUILD_MANIFEST.md"
            echo "- Full build log: ci-build.log.gz; all logs: build-logs.tar.gz"
            echo
            echo "### Verification"
            grep -m1 '^Result:' out/VERIFY.md
            echo
            echo "### Differences from the official package"
            sed -n '/^## Differences/,$p' out/COMPARISON.md | tail -n +2
          } > notes.md
          gh release create "$TAG" "$PKG" out/SHA256SUMS out/FILES.sha256 out/validate.txt out/BUILD_MANIFEST.md out/VERIFY.md out/COMPARISON.md \
            ci-build.log.gz build-logs.tar.gz --prerelease --target "$GITHUB_SHA" \
            --title "UNTESTED DEVICE BUILD: WinePS4 v${WINEPS4_VERSION} (source build #${GITHUB_RUN_NUMBER})" \
            --notes-file notes.md
